services:
  app:
    build: .
    container_name: lang_app_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      # Persist uploaded avatars on the host EBS volume
      - avatars_data:/app/uploads/avatars
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lang_app_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # Enable AOF persistence and cap RAM usage for EC2 t3.micro
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

volumes:
  avatars_data:
  redis_data: